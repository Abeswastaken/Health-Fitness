name: Build APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - name: Version
        run: |
          base=$(tr -d '[:space:]' < version.txt)
          if [ "${GITHUB_REF_NAME}" = "main" ]; then v="${base}.${BUILD_NUMBER}"; else v="${base}.${BUILD_NUMBER}-test"; fi
          echo "VERSION_NAME=$v" >> "$GITHUB_ENV"
          echo "Version $v"

      - name: Logic tests (future Kotlin core)
        working-directory: preview
        run: node test_logic.js

      - name: Check the preview scripts parse
        working-directory: preview
        run: node --check app.js && node --check panel.js && node --check logic.js

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: gradle -p android assembleDebug --stacktrace

      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "Health-Fitness-${VERSION_NAME}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Health-Fitness-${{ env.VERSION_NAME }}
          path: Health-Fitness-*.apk

      - name: Publish test build (branches)
        if: github.ref_name != 'main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-${{ github.run_number }}
          name: Test build ${{ env.VERSION_NAME }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: Health-Fitness-*.apk
          body: Test APK from `${{ github.ref_name }}`. Installs over earlier builds.

      - name: Publish release (main)
        if: github.ref_name == 'main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: Health-Fitness v${{ env.VERSION_NAME }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: Health-Fitness-*.apk
          body: |
            Installs over earlier builds. Data stays on the phone; use Settings > Data > Back up now and then.
            Design panel: Settings > Developer.
